name: Atualizar PTAX USD-BRL
on:
  workflow_dispatch:
  schedule:
    - cron: '15 13,17,21 * * 1-5'
permissions:
  contents: write
jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Consultar Banco Central
        run: python scripts/update_usd_brl.py
      - name: Salvar cotação no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/usd-brl.json
          if ! git diff --cached --quiet; then
            git commit -m "data: atualizar PTAX USD/BRL"
            git push
          fi
