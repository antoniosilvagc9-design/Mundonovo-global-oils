name: Diagnóstico de acesso Bursa Malaysia (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnosticar:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Teste HTTP único, sem bypass nem retentativas
        run: python scripts/diagnose_bursa_access.py
