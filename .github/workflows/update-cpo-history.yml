name: Atualizar CPO FCPO Commodities API
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  cpo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Coletar futuro FCPO via Commodities-API
        env:
          COMMODITIES_API_KEY: ${{ secrets.COMMODITIES_API_KEY }}
        run: python scripts/update_cpo_history.py
      - name: Publicar dados validados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cpo-history.json
          git diff --cached --quiet || (git commit -m "Atualiza CPO oficial MPOB" && git push)
