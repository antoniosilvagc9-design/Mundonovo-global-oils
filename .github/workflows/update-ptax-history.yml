name: Atualizar histórico PTAX
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */3 * * *'
permissions:
  contents: write
jobs:
  ptax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Consultar Banco Central
        run: python scripts/update_ptax_history.py
      - name: Publicar somente se houver mudança
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/usd-brl-history.json
          git diff --cached --quiet || (git commit -m "Atualiza histórico oficial PTAX" && git push)
