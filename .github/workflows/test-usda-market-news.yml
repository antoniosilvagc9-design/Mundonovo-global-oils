name: Test USDA Market News
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Authenticate and discover agricultural reports
        env:
          USDA_API_KEY: ${{ secrets.USDA_API_KEY }}
        run: |
          python - <<'PY'
          import os, urllib.request, urllib.error, base64, json, re
          key = os.environ.get("USDA_API_KEY", "")
          if not key:
              raise SystemExit("USDA_API_KEY missing")
          auth = base64.b64encode((key + ":").encode()).decode()
          req = urllib.request.Request("https://marsapi.ams.usda.gov/services/v1.2/reports", headers={"Authorization": "Basic " + auth, "Accept": "application/json"})
          try:
              with urllib.request.urlopen(req, timeout=45) as response:
                  data = json.load(response)
          except urllib.error.HTTPError as exc:
              raise SystemExit("USDA HTTP status: " + str(exc.code))
          rows = data.get("results") if isinstance(data, dict) else data
          if not isinstance(rows, list) or not rows:
              raise SystemExit("Unexpected or empty report catalog")
          print("Authentication successful. Catalog records:", len(rows))
          print("Catalog fields:", sorted({k for row in rows if isinstance(row, dict) for k in row}))
          print("Sample catalog entry:", json.dumps(rows[0], ensure_ascii=True)[:1800])
          matches = 0
          for row in rows:
              if not isinstance(row, dict):
                  continue
              name = json.dumps(row, ensure_ascii=True)
              if re.search(r"soy|oilseed|oil|grain|feedstuff|canola|rapeseed|sunflower|palm|meal", name, re.I):
                  if matches < 150:
                      print(json.dumps(row, ensure_ascii=True)[:1800])
                  matches += 1
          print("Matching report names:", matches)
          for slug in ("3668", "3618", "3878"):
              url = "https://marsapi.ams.usda.gov/services/v1.2/reports/" + slug + "/Report%20Detail"
              try:
                  request = urllib.request.Request(url, headers={"Authorization": "Basic " + auth, "Accept": "application/json"})
                  with urllib.request.urlopen(request, timeout=45) as response:
                      detail = json.load(response)
                  records = detail.get("results", []) if isinstance(detail, dict) else detail
                  print("DETAIL", slug, "records:", len(records))
                  if isinstance(records, list) and records:
                      print("Fields:", sorted(records[0]) if isinstance(records[0], dict) else "unknown")
                      commodities = sorted({str(item.get("commodity", "")) for item in records if isinstance(item, dict)})
                      print("COMMODITIES", slug, json.dumps(commodities))
                      selected = [item for item in records if isinstance(item, dict) and re.search(r"soy|oil|canola|palm|sunflower|rapeseed", str(item.get("commodity", "")), re.I)]
                      print("TARGET RECORDS", slug, len(selected))
                      for item in selected[:12]:
                          print("TARGET", slug, json.dumps(item, ensure_ascii=True)[:2200])
              except (urllib.error.URLError, ValueError, TypeError) as exc:
                  print("DETAIL", slug, "failed:", type(exc).__name__, getattr(exc, "code", ""))
          print("Diagnostic only. No prices published.")
          PY
