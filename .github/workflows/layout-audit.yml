name: Mundo Novo Layout Auditor
on:
  push:
    paths:
      - 'index.html'
      - 'assets/css/**'
      - 'tests/layout-audit.cjs'
      - '.github/workflows/layout-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 8000 > /tmp/layout-server.log 2>&1 &
          for i in {1..20}; do curl -fsS http://127.0.0.1:8000/index.html >/dev/null && break; sleep 1; done
          node tests/layout-audit.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: layout-report
          path: layout-report/
          retention-days: 7
