name: Baixar imagem do banner principal
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  banners:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow
      - name: Baixar fotos Pixabay
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: |
          python - <<'PY'
          import os, json, urllib.request, urllib.parse, io
          from PIL import Image, ImageOps
          from pathlib import Path
          key = os.environ['PIXABAY_API_KEY']
          if not key: raise RuntimeError('Secret Pixabay ausente')
          folder = Path('data/home-images')
          folder.mkdir(parents=True, exist_ok=True)
          queries = {'hero':['container port aerial sunset','container terminal aerial','cargo port']}
          credit_file = folder/'credits.json'
          credits = json.loads(credit_file.read_text(encoding='utf-8')) if credit_file.exists() else {}
          for name, terms in queries.items():
              hits = []
              for term in terms:
                  params = urllib.parse.urlencode(dict(key=key,q=term,image_type='photo',orientation='horizontal',safesearch='true',per_page=40,min_width=1920))
                  print('Consultando Pixabay:', name, term, flush=True)
                  req = urllib.request.Request('https://pixabay.com/api/?'+params, headers={'User-Agent':'TradingGlobalNews/1.0'})
                  with urllib.request.urlopen(req,timeout=30) as response:
                      hits = json.load(response).get('hits',[])
                  if hits: break
              if not hits: raise RuntimeError('Sem imagem para '+name)
              hits.sort(key=lambda h: (h.get('imageWidth',0)/max(h.get('imageHeight',1),1)>=1.8, h.get('imageWidth',0)), reverse=True)
              hit = None
              for candidate in hits:
                  url = candidate.get('largeImageURL')
                  if not url: continue
                  try:
                      req = urllib.request.Request(url, headers={'User-Agent':'Mozilla/5.0','Accept':'image/*'})
                      with urllib.request.urlopen(req,timeout=45) as response:
                          raw = response.read()
                      photo = ImageOps.exif_transpose(Image.open(io.BytesIO(raw))).convert('RGB')
                      if photo.width < 1200: continue
                      hit = candidate
                      break
                  except Exception as exc:
                      print('Imagem indisponivel:', type(exc).__name__)
              if hit is None: raise RuntimeError('Nenhuma imagem de alta resolucao disponivel; original preservado')
              print('Baixando fotografia:', name, flush=True)
              print('Resolucao real:', photo.width, 'x', photo.height)
              photo.save(folder/(name+'.jpg'), format='JPEG', quality=94, optimize=True)
              credits[name] = {'source':hit['pageURL'],'author':hit['user']}
              print(name, hit['pageURL'])
          (folder/'credits.json').write_text(json.dumps(credits,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - name: Publicar imagens
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f data/home-images/hero.jpg data/home-images/credits.json
          git diff --cached --quiet || (git commit -m 'Adiciona fotografias dos banners' && git push)
