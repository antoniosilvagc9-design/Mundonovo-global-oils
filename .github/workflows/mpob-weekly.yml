name: Atualizar precos semanais MPOB
on:
  workflow_dispatch:
  schedule:
    - cron: '30 7 * * 1'
permissions:
  contents: write
jobs:
  import-mpob:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias
        run: python -m pip install openpyxl==3.1.5
      - name: Baixar e validar relatorios oficiais
        run: python scripts/mpob_weekly.py
      - name: Publicar dataset somente se todos os downloads funcionarem
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/mpob-weekly-prices.json
          if ! git diff --cached --quiet; then
            git commit -m "data: atualizar precos semanais MPOB"
            git push
          fi
