name: Atualizar notícias Trading Global

on:
  workflow_dispatch:
  schedule:
    - cron: '23 */3 * * *'

permissions:
  contents: write

concurrency:
  group: trading-global-news
  cancel-in-progress: false

jobs:
  news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Coletar notícias e imagens
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: python scripts/update_market_news.py

      - name: Validar JSON
        run: python -m json.tool data/market-news.json > /dev/null

      - name: Publicar feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market-news.json
          if [ -d data/news-images ]; then git add -f data/news-images/*.jpg; fi
          git diff --cached --quiet || (git commit -m "Atualiza radar de notícias verificáveis" && git push)
