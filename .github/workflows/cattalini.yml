name: Cattalini Line Up
on:
  workflow_dispatch:
  schedule:
    - cron: '0 11,15,19 * * *'
permissions:
  contents: write
concurrency:
  group: cattalini-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - run: python scripts/update_cattalini.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cattalini
          git diff --cached --quiet || git commit -m "Update Cattalini Line Up"
          git pull --rebase
          git push
