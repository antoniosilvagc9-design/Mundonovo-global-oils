name: Atualizar histórico soja CBOT
on:
  workflow_dispatch:
  schedule:
    - cron: '52 */3 * * *'
permissions:
  contents: write
jobs:
  soybean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Consultar série diária indicativa de soja
        run: python scripts/update_soybean_history.py
      - name: Publicar somente dados novos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/soybean-history.json
          git diff --cached --quiet || (git commit -m "Atualiza histórico soja CBOT" && git push)
