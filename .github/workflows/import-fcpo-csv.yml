name: Importar FCPO de CSV autorizado
on:
  workflow_dispatch:
  push:
    paths:
      - 'data/fcpo-inbox/*.csv'
permissions:
  contents: write
concurrency:
  group: fcpo-import
  cancel-in-progress: false
jobs:
  importar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validar CSVs e gerar JSON somente com dados enviados
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv, pathlib, subprocess, sys
          folder = pathlib.Path("data/fcpo-inbox")
          required = {"day_id", "prod_id", "contract_month", "set_price", "previous", "change", "volume", "open_interest"}
          valid = []
          for path in sorted(folder.glob("*.csv")):
              try:
                  with path.open(encoding="utf-8-sig", newline="") as stream:
                      columns = set((csv.reader(stream, delimiter="|").__next__()))
                  if required.issubset(columns):
                      valid.append(str(path))
                  else:
                      print(f"Ignorando CSV sem preços FCPO: {path.name}")
              except (UnicodeError, OSError, StopIteration) as exc:
                  print(f"Ignorando arquivo ilegível {path.name}: {exc}")
          if not valid:
              print("::error::Nenhum CSV de estatísticas FCPO com campo set_price encontrado em data/fcpo-inbox/. Faça upload do derivative_trading_statistic, mesmo que o celular renomeie o arquivo.")
              sys.exit(1)
          print(f"Arquivos com estrutura de preços: {len(valid)}")
          subprocess.run([sys.executable, "scripts/import_fcpo_csv.py", *valid, "--output", "data/cpo-history.json", "--existing", "data/cpo-history.json"], check=True)
          PY
      - name: Publicar somente se JSON mudou
        shell: bash
        run: |
          if [ ! -f data/cpo-history.json ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cpo-history.json
          if ! git diff --cached --quiet; then
            git commit -m "Atualiza histórico FCPO a partir de CSVs autorizados"
            git push
          fi
