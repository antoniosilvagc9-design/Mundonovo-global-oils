name: Importar FCPO de CSV autorizado
on:
  workflow_dispatch:
  push:
    paths:
      - 'data/fcpo-inbox/derivative_trading_statistic_*.csv'
permissions:
  contents: write
concurrency:
  group: fcpo-import
  cancel-in-progress: false
jobs:
  importar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validar CSVs e gerar JSON somente com dados enviados
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(data/fcpo-inbox/derivative_trading_statistic_*.csv)
          if (( ${#files[@]} == 0 )); then
            echo "::error::Nenhum CSV FCPO encontrado em data/fcpo-inbox/. Envie arquivos derivative_trading_statistic_YYYYMMDD.csv para essa pasta antes de executar."
            exit 1
          fi
          python scripts/import_fcpo_csv.py "${files[@]}" --output data/cpo-history.json
      - name: Publicar somente se JSON mudou
        shell: bash
        run: |
          if [ ! -f data/cpo-history.json ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cpo-history.json
          if ! git diff --cached --quiet; then
            git commit -m "Atualiza histórico FCPO a partir de CSVs autorizados"
            git push
          fi
