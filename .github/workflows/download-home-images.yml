name: Baixar imagens dos banners
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  banners:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Baixar fotos Pixabay
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: |
          python - <<'PY'
          import os, json, urllib.request, urllib.parse
          from pathlib import Path
          key = os.environ['PIXABAY_API_KEY']
          if not key: raise RuntimeError('Secret Pixabay ausente')
          folder = Path('data/home-images')
          folder.mkdir(parents=True, exist_ok=True)
          queries = {'quotes':['stock market trading screen','stock market'], 'supply':['container ship port','cargo ship'], 'news':['newspaper journalism','newspaper'], 'intelligence':['oil refinery storage tanks','oil refinery']}
          credits = {}
          for name, terms in queries.items():
              hits = []
              for term in terms:
                  params = urllib.parse.urlencode(dict(key=key,q=term,image_type='photo',orientation='horizontal',safesearch='true',per_page=20,min_width=960))
                  with urllib.request.urlopen('https://pixabay.com/api/?'+params,timeout=30) as response:
                      hits = json.load(response).get('hits',[])
                  if hits: break
              if not hits: raise RuntimeError('Sem imagem para '+name)
              hit = hits[0]
              with urllib.request.urlopen(hit['largeImageURL'],timeout=45) as response:
                  data = response.read()
              if not data.startswith(b'\xff\xd8'): raise RuntimeError('Imagem nao JPEG: '+name)
              (folder/(name+'.jpg')).write_bytes(data)
              credits[name] = {'source':hit['pageURL'],'author':hit['user']}
              print(name, hit['pageURL'])
          (folder/'credits.json').write_text(json.dumps(credits,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - name: Publicar imagens
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f data/home-images
          git diff --cached --quiet || (git commit -m 'Adiciona fotografias dos banners' && git push)
