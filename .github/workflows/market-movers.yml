name: Market movers
on:
  workflow_dispatch:
  schedule:
    - cron: '15 15,18,21 * * 1-5'
permissions:
  contents: write
concurrency:
  group: market-movers
  cancel-in-progress: false
jobs:
  update:
    if: vars.MARKET_MOVERS_DISPLAY_AUTHORIZED == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Collect licensed quotes
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: python scripts/market_movers.py
      - name: Publish snapshot
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add data/market-movers.json
          git diff --cached --quiet || git commit -m "Refresh market movers"
          git pull --rebase
          git push
